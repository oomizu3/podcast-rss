name: book-prices
on:
  schedule:
    - cron: '10 21 * * *'   # 06:10 JST
    - cron: '10 9 * * *'    # 18:10 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency: book-prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        env:
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
        run: python3 books/fetch_prices.py
      - name: Commit
        run: |
          git config user.name "book-prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/prices.json
          git commit -m "book prices $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
